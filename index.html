<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setback 2.0</title>
<style>
:root { --bg:#eef8ea; --ink:#2f3d4a; --card:#fdfcf4; --rust:#f0786a; --teal:#3aaea0; --mustard:#f6c444; --line:#b9d9c2; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#1f2b2a; --ink:#f1f7ee; --card:#2a3a38; --rust:#f5938a; --teal:#6fcfc2; --mustard:#f8d572; --line:#3f5a55; }
}
* { box-sizing: border-box; }
body { margin:0; font-family: Georgia, "Didot", "Times New Roman", serif; background:var(--bg); color:var(--ink); padding: env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px); }
h1 { margin: 12px 0 4px; font-size: 2.1rem; font-weight: normal; letter-spacing: 2px; text-align:center; }
.sub { margin:0 0 14px; opacity:.75; font-size:.95rem; font-style: italic; text-align:center; }
.wrap { max-width: 1060px; margin: 0 auto; display:grid; grid-template-columns: minmax(0,1fr) 300px; gap:16px; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
.card { background:var(--card); border:2px solid var(--line); border-radius:6px; padding:14px; box-shadow: 4px 4px 0 var(--line); }
svg#board { width:100%; height:auto; display:block; }
.players { display:flex; flex-direction:column; gap:8px; }
.player { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:4px; border:2px solid transparent; }
.player.active { border-color: var(--ink); background: rgba(0,0,0,.03); }
.dot { width:14px; height:14px; border-radius:50%; flex:0 0 14px; border:1px solid var(--ink); }
.pname { font-weight:bold; flex:1; }
.pmeta { font-size:.85rem; opacity:.8; }
button { font: inherit; border:2px solid var(--ink); border-radius:4px; padding:10px 14px; cursor:pointer; background:var(--ink); color:var(--bg); font-weight:bold; }
button:disabled { opacity:.4; cursor:default; }
button.alt { background:transparent; color:var(--ink); }
button.picked { background:var(--ink); color:var(--bg); }
.dice { font-size:1.6rem; font-weight:bold; text-align:center; margin:8px 0; min-height:2.4rem; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > button { flex:1; }
.log { height: 220px; overflow-y:auto; font-size:.9rem; line-height:1.45; margin-top:10px; }
.log div { padding:3px 0; border-bottom:1px dashed var(--line); }
.legend { font-size:.85rem; display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; justify-content:center; }
.legend span::before { content:""; display:inline-block; width:12px; height:12px; margin-right:5px; vertical-align:middle; background: var(--c); border:1px solid var(--ink); }
.banner { text-align:center; font-weight:bold; font-size:1.1rem; min-height:1.6rem; margin:6px 0; }
.setup label { display:block; margin:8px 0 4px; font-size:.9rem; }
.setup input { width:100%; padding:8px; border-radius:4px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
</style>
</head>
<body>
<h1>Setback 2.0</h1>
<p class="sub">A game of persistence. Can you reach the Golden Square?</p>

<div class="wrap">
  <div class="card">
    <svg id="board" viewBox="55 65 490 520" role="img" aria-label="Game board"></svg>
    <div class="legend">
      <span style="--c:#b5532f">Setback</span>
      <span style="--c:#9bb08a">Smile</span>
      <span style="--c:#f6c444">Start/Finish</span>
    </div>
  </div>

  <div class="card">
    <div id="setup" class="setup">
      <label>Number of players</label>
      <div class="row">
        <button class="alt" data-n="1">1</button>
        <button class="alt" data-n="2">2</button>
        <button class="alt" data-n="3">3</button>
        <button class="alt" data-n="4">4</button>
      </div>
      <label>Names (optional, comma-separated)</label>
      <input id="names">
      <div style="margin-top:12px"><button id="start" disabled>Start game</button></div>
    </div>

    <div id="game" hidden>
      <div id="banner" class="banner"></div>
      <div class="players" id="players"></div>
      <div class="dice" id="dice">&nbsp;</div>
      <div class="row">
        <button id="roll">Roll dice</button>
        <button class="alt" id="restart">New game</button>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
const COLORS = ["#2e5aa8", "#8e3b6b", "#6b4f2a", "#7a5cc2"];
const INK = "#2f3d4a";
const FINISH = 36;        // ring of 37 squares: square 0 is Start, squares 1-36 are landable, FINISH is the top
const N = FINISH;
const SETBACKS = 21;
const JUMPS = 6;
const NORMALS = 8;
const STEP_MS = 170;
const CX = 300, CY = 330, R = 200;

let setbacks = new Set(); // squares that are Setbacks
let jumps = new Set();    // squares that are Jumps
let players = [];
let turn = 0, won = false, rolled = false, animating = false;
let pendingSpecial = false, pendingKind = "";

const sleep = ms => new Promise(r => setTimeout(r, ms));
function rand(n) { return Math.floor(Math.random() * n); }

// The 15 non-Setback squares (6 Smiles, 9 Normals) are spaced so that none of them touch.
// Spacing alternates between 2 and 3 squares around the ring. The three-square gaps (which leave
// two Setbacks back-to-back) are grouped in the bottom-left arc around 7:30 on the clock.
const ITEM_SQUARES = [1, 3, 5, 7, 9, 11, 14, 17, 20, 23, 26, 29, 32, 35];

function generateBoard() {
  setbacks = new Set(); jumps = new Set();
  for (let t = 1; t < FINISH; t++) setbacks.add(t);
  const order = ITEM_SQUARES.slice();
  for (let i = order.length - 1; i > 0; i--) { const j = rand(i + 1); [order[i], order[j]] = [order[j], order[i]]; }
  order.forEach((t, i) => {
    setbacks.delete(t);
    if (i < JUMPS) jumps.add(t);   // the rest stay as Normal squares
  });
}

function tileXY(index, radius) {
  const a = -Math.PI / 2 + index * (2 * Math.PI / N);
  return { x: CX + radius * Math.cos(a), y: CY + radius * Math.sin(a), a, deg: a * 180 / Math.PI + 90 };
}

function defs() {
  return `<defs>
    <pattern id="pNormal" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fdfcf4"/>
      <path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#8fd6c4" opacity=".55"/>
    </pattern>
    <pattern id="pSetback" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f0786a"/>
      <path d="M0 2 L4 6 L8 2" stroke="#fdfcf4" stroke-width="1.2" fill="none"/>
    </pattern>
    <pattern id="pJump" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#a6e3a1"/>
      <path d="M0 2.5 H8 M0 5.5 H8" stroke="#2c8c7e" stroke-width="1.1"/>
    </pattern>
    <pattern id="pFinish" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6c444"/>
      <path d="M0 0 L4 4 L8 0 M0 8 L4 4 L8 8" stroke="#fdfcf4" stroke-width=".9" fill="none" opacity=".8"/>
    </pattern>
  </defs>`;
}

function figure(color, kind) {
  const base = `
    <ellipse cx="0" cy="13" rx="8" ry="2.2" fill="rgba(47,61,74,.2)"/>
    <path d="M-3.2 5 L-3.6 13 M3.2 5 L3.6 13" stroke="#8a7a5c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-6 -1 Q0 -3 6 -1 L7 9 Q0 11 -7 9 Z" fill="${color}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-6 -1 L-9.5 6" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="-7" r="4" fill="#f5d4b0" stroke="${INK}" stroke-width="1.1"/>
    <path d="M-4.6 -6 Q-4.6 -11.6 0 -11.6 Q4.6 -11.6 4.6 -6 L4.6 -5 L-4.6 -5 Z" fill="#b9c2c8" stroke="${INK}" stroke-width="1"/>
    <path d="M0 -10.5 L0 -5" stroke="${INK}" stroke-width="1"/>`;
  let extra = "";
  if (kind === 0) {   // pikeman
    extra = `<path d="M8 13 L11 -24" stroke="#8a6a3f" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M10 -24 L11 -30 L12 -24 Z" fill="#b9c2c8" stroke="${INK}" stroke-width=".7"/>
      <path d="M11 -22 L17 -20 L11 -18 Z" fill="${color}" stroke="${INK}" stroke-width=".6"/>`;
  } else if (kind === 1) {   // crossbowman
    extra = `<path d="M-1 2 L13 0" stroke="#8a6a3f" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M12 -7 Q15 0 12 7" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
  } else if (kind === 2) {   // shield-bearer with sword
    extra = `<path d="M-13 -2 L-7 -2 L-7 6 Q-10 10 -13 6 Z" fill="${color}" stroke="${INK}" stroke-width="1"/>
      <path d="M-10 0 L-10 7" stroke="#fdfcf4" stroke-width="1"/>
      <path d="M7 8 L13 -6" stroke="#b9c2c8" stroke-width="1.4" stroke-linecap="round"/>`;
  } else {   // archer
    extra = `<path d="M13 -10 Q18 2 13 12" fill="none" stroke="#8a6a3f" stroke-width="1.4"/>
      <path d="M13 -10 L13 12" stroke="${INK}" stroke-width=".6"/>`;
  }
  return base + extra;
}

function drawBoard() {
  let s = defs();
  s += `<circle cx="${CX}" cy="${CY}" r="${R + 18}" fill="none" stroke="${INK}" stroke-width="1.6"/>`;
  s += `<circle cx="${CX}" cy="${CY}" r="${R - 22}" fill="none" stroke="${INK}" stroke-width=".8" stroke-dasharray="2 4"/>`;
  for (let i = 0; i < N; i++) {
    const { x, y, deg } = tileXY(i, R);
    let fill = "url(#pNormal)";
    if (i === 0) fill = "url(#pFinish)";
    else if (setbacks.has(i)) fill = "url(#pSetback)";
    else if (jumps.has(i)) fill = "url(#pJump)";
    let deco = "";
    if (setbacks.has(i)) deco = `<text x="0" y="2" text-anchor="middle" dominant-baseline="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-weight="bold" font-size="34" fill="#fdfcf4" stroke="${INK}" stroke-width="1" paint-order="stroke">S</text>`;
    else if (jumps.has(i)) deco = `<circle cx="0" cy="0" r="8" fill="#fff8d6" stroke="${INK}" stroke-width="1.2"/><circle cx="-3" cy="-2.5" r="1.3" fill="${INK}"/><circle cx="3" cy="-2.5" r="1.3" fill="${INK}"/><path d="M-4 2 Q0 6 4 2" fill="none" stroke="${INK}" stroke-width="1.4" stroke-linecap="round"/>`;
    s += `<g transform="translate(${x} ${y}) rotate(${deg})"><rect x="-11" y="-11" width="22" height="22" rx="1.5" fill="${fill}" stroke="${INK}" stroke-width="1.2"/>${deco}</g>`;
  }
  const f = tileXY(0, R + 40);
  s += `<text x="${f.x}" y="${f.y}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" letter-spacing="2" fill="${INK}">START/FINISH</text>`;
  players.forEach((p, idx) => {
    const { x, y, a } = tileXY(((p.shown % N) + N) % N, R);
    const shift = (idx - (players.length - 1) / 2) * 12;
    const px = x - Math.sin(a) * shift, py = y + Math.cos(a) * shift;
    s += `<g transform="translate(${px} ${py}) scale(1.35)">${figure(p.color, p.kind)}</g>`;
  });
  document.getElementById("board").innerHTML = s;
}

function escapeHTML(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderPlayers() {
  document.getElementById("players").innerHTML = players.map((p, i) => `
    <div class="player ${i === turn && !won ? "active" : ""}">
      <div class="dot" style="background:${p.color}"></div>
      <div class="pname">${escapeHTML(p.name)}</div>
      <div class="pmeta">${p.pos}/${FINISH} · ${p.setbacks} setback${p.setbacks === 1 ? "" : "s"} · ${p.smiles} smile${p.smiles === 1 ? "" : "s"}</div>
    </div>`).join("");
}

function log(msg) {
  document.getElementById("log").insertAdjacentHTML("afterbegin", `<div>${msg}</div>`);
}

function render() {
  drawBoard();
  renderPlayers();
  document.getElementById("roll").disabled = won || animating;
  document.getElementById("banner").textContent = won
    ? `${players[turn].name} got past the top and wins!`
    : pendingSpecial
      ? `${players[turn].name} landed on a ${pendingKind}. Roll to move!`
      : `${players[turn].name}'s turn`;
}

async function animatePath(p, path) {
  for (const pos of path) {
    p.shown = pos;
    drawBoard();
    await sleep(STEP_MS);
  }
}

// Walk forward n squares. Passing the Finish wins the game.
async function walkForward(p, n) {
  const path = [];
  let cur = p.pos;
  for (let k = 0; k < n; k++) {
    cur++;
    path.push(cur);
  }
  await animatePath(p, path);
  p.pos = cur;
  // Crossing the Finish line wins, but the piece still plays out the rest of the roll.
  if (cur >= FINISH) won = true;
}

async function rollDice() {
  if (won || animating) return;
  if (pendingSpecial) return resolveSpecial();
  if (rolled) return;
  animating = true;
  rolled = true;
  render();

  const a = 1 + rand(6), b = 1 + rand(6), roll = a + b;
  document.getElementById("dice").textContent = `${a} + ${b} = ${roll}`;
  const p = players[turn];
  log(`<b>${p.name}</b> rolled ${roll}.`);

  await walkForward(p, roll);
  p.shown = p.pos;
  afterLanding(p);
}

// Called after a piece lands. Setbacks and Jumps wait for the player's next roll.
function afterLanding(p) {
  if (won) {
    log(`<b>${p.name} got past the top and wins!</b>`);
    endTurn();
    return;
  }
  if (setbacks.has(sq(p.pos))) {
    p.setbacks++;
    pendingSpecial = true; pendingKind = "Setback";
    log(`${p.name} landed on a Setback. Roll to see how far back!`);
  } else if (jumps.has(sq(p.pos))) {
    p.smiles++;
    pendingSpecial = true; pendingKind = "Smile";
    log(`${p.name} landed on a Smile. Roll to see how far forward!`);
  } else {
    endTurn();
    return;
  }
  animating = false;
  render();
}

// Progress is tracked linearly: 0 is Start, FINISH is the Start/Finish line reached going forward.
// Going back past Start makes progress negative, so the piece must travel all the way around again.
// sq() maps progress to the ring square it sits on.
function sq(x) { return ((x % N) + N) % N; }

async function resolveSpecial() {
  animating = true;
  pendingSpecial = false;
  render();

  const d = 1 + rand(6);
  const p = players[turn];
  const start = p.pos;
  document.getElementById("dice").textContent = `${pendingKind}! Roll ${d}`;

  if (pendingKind === "Setback") {
    log(`${p.name} rolled ${d} and slides back ${d}.`);
    const seq = [];
    for (let k = 1; k <= d; k++) seq.push(start - k);
    await animatePath(p, seq);
    p.pos = start - d;
  } else {
    log(`${p.name} rolled ${d} and moves forward ${d}.`);
    await walkForward(p, d);
  }
  p.shown = p.pos;
  afterLanding(p);
}

function endTurn() {
  if (!won) turn = (turn + 1) % players.length;
  rolled = false;
  pendingSpecial = false;
  animating = false;
  players.forEach(q => q.shown = q.pos);
  render();
}

function startGame() {
  const count = Number(document.querySelector("#setup .picked").dataset.n);
  const raw = document.getElementById("names").value.split(",").map(s => s.trim()).filter(Boolean);
  players = Array.from({ length: count }, (_, i) => ({ name: raw[i] || `Player ${i + 1}`, pos: 0, shown: 0, color: COLORS[i], kind: rand(4), setbacks: 0, smiles: 0 }));
  generateBoard();
  turn = 0; won = false; rolled = false; animating = false; pendingSpecial = false;
  document.getElementById("log").innerHTML = "";
  document.getElementById("dice").innerHTML = "&nbsp;";
  document.getElementById("setup").hidden = true;
  document.getElementById("game").hidden = false;
  log(`Board built: ${SETBACKS} Setbacks, ${JUMPS} Smiles, ${NORMALS} normal squares. Good luck!`);
  render();
}

document.querySelectorAll("#setup [data-n]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#setup [data-n]").forEach(b => b.classList.remove("picked"));
    btn.classList.add("picked");
    document.getElementById("start").disabled = false;
  });
});
document.getElementById("start").addEventListener("click", startGame);
document.getElementById("roll").addEventListener("click", rollDice);
document.getElementById("restart").addEventListener("click", () => {
  document.getElementById("setup").hidden = false;
  document.getElementById("game").hidden = true;
});
</script>
</body>
</html>
